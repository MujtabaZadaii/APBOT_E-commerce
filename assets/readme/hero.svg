<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <!-- Background Canvas: Deep Obsidian Velvet (#101010) -->
  <rect width="1200" height="420" fill="#101010" rx="16"/>

  <!-- Luxury Gold Inner Border Frame -->
  <rect x="18" y="18" width="1164" height="384" fill="none" stroke="#C5A059" stroke-width="1.5" stroke-opacity="0.6" rx="12"/>
  <rect x="26" y="26" width="1148" height="368" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" rx="10"/>

  <!-- Top Left Badge Tag -->
  <g transform="translate(60, 55)">
    <rect width="210" height="30" fill="#1A1A1A" stroke="#C5A059" stroke-width="1" rx="15"/>
    <circle cx="16" cy="15" r="4.5" fill="#10B981"/>
    <text x="32" y="19" fill="#EFEDE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">ACADEMIC AI/ML SRS</text>
  </g>

  <!-- Main Luxury Title: S A B L E | ApBot AI Concierge -->
  <text x="60" y="145" fill="#EFEDE8" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700" letter-spacing="8">S A B L E</text>
  <text x="345" y="145" fill="#C5A059" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="300" letter-spacing="2">| ApBot AI Concierge</text>

  <!-- Subtitle Line -->
  <text x="60" y="188" fill="#8A8781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="0.5">
    200-Epoch TensorFlow/Keras Neural Network and Domain NLP Assistant for SABLE Haute Couture
  </text>

  <!-- Divider Gold Line -->
  <line x1="60" y1="210" x2="1140" y2="210" stroke="#C5A059" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Technical Highlight Metrics Cards (3 Cards) -->
  <g transform="translate(60, 235)">
    <!-- Card 1: TensorFlow Model -->
    <g transform="translate(0, 0)">
      <rect width="340" height="120" fill="#181818" stroke="#282828" stroke-width="1" rx="10"/>
      <rect width="340" height="120" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.2" rx="10"/>
      <text x="24" y="34" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">TENSORFLOW &amp; KERAS MODEL</text>
      <text x="24" y="66" fill="#EFEDE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">91.58% Validation Accuracy</text>
      <text x="24" y="93" fill="#8A8781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">40+ Intent Tags • Bag of Words • Lemmatizer</text>
    </g>

    <!-- Card 2: NLP Typo Corrector -->
    <g transform="translate(370, 0)">
      <rect width="340" height="120" fill="#181818" stroke="#282828" stroke-width="1" rx="10"/>
      <rect width="340" height="120" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.2" rx="10"/>
      <text x="24" y="34" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">DOMAIN SPELL CORRECTOR</text>
      <text x="24" y="66" fill="#EFEDE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">16/16 Unit Tests Passed</text>
      <text x="24" y="93" fill="#8A8781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Normalizes typos • Preserves prices &amp; IDs</text>
    </g>

    <!-- Card 3: Architecture Stack -->
    <g transform="translate(740, 0)">
      <rect width="340" height="120" fill="#181818" stroke="#282828" stroke-width="1" rx="10"/>
      <rect width="340" height="120" fill="none" stroke="#C5A059" stroke-width="1" stroke-opacity="0.2" rx="10"/>
      <text x="24" y="34" fill="#C5A059" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">MERN + FLASK STACK</text>
      <text x="24" y="66" fill="#EFEDE8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">&lt; 150ms Response Time</text>
      <text x="24" y="93" fill="#8A8781" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">MongoDB • Express • React • Flask Port 5001</text>
    </g>
  </g>
</svg>
