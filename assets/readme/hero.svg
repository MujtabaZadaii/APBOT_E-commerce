<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0B"/>
      <stop offset="50%" stop-color="#121214"/>
      <stop offset="100%" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111114" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/>

  <!-- Subtle Luxury Grid Patterns -->
  <g opacity="0.05">
    <path d="M0,70 L1200,70 M0,140 L1200,140 M0,210 L1200,210 M0,280 L1200,280 M0,350 L1200,350" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M200,0 L200,420 M400,0 L400,420 M600,0 L600,420 M800,0 L800,420 M1000,0 L1000,420" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="950" cy="150" r="180" fill="#D4AF37" opacity="0.06" filter="blur(40px)"/>
  <circle cx="250" cy="300" r="160" fill="#4F46E5" opacity="0.05" filter="blur(40px)"/>

  <!-- Left Side: Project Identity -->
  <g transform="translate(80, 80)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#1E1E24" stroke="#D4AF37" stroke-width="1"/>
    <text x="65" y="18" fill="#D4AF37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SABLE LUXURY</text>

    <!-- Title -->
    <text x="0" y="80" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">APBOT <tspan fill="url(#goldGrad)">AI</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="122" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="0.2">Next-Gen Multimodal E-Commerce AI Assistant</text>
    <text x="0" y="148" fill="#71717A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">Powered by TensorFlow, Keras, MongoDB &amp; Real-Time Voice NLP</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 185)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#10B981"/>
      <text x="30" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">200 Epochs Trained</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="145" height="34" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="168" cy="17" r="4" fill="#6366F1"/>
      <text x="180" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Visual AI Search</text>

      <!-- Pill 3 -->
      <rect x="305" y="0" width="150" height="34" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1"/>
      <circle cx="323" cy="17" r="4" fill="#F59E0B"/>
      <text x="335" y="22" fill="#E4E4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Live Voice &amp; TTS</text>
    </g>
  </g>

  <!-- Right Side: Interactive Bot Mockup Card -->
  <g transform="translate(740, 50)" filter="url(#shadow)">
    <rect x="0" y="0" width="380" height="320" rx="16" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect x="0" y="0" width="380" height="54" rx="16" fill="#141417"/>
    <rect x="0" y="38" width="380" height="16" fill="#141417"/>
    <circle cx="28" cy="27" r="14" fill="#000000" stroke="#D4AF37" stroke-width="1"/>
    <text x="28" y="32" fill="#D4AF37" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">A</text>
    <text x="52" y="31" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" letter-spacing="1">APBOT ASSISTANT</text>
    <circle cx="340" cy="27" r="4" fill="#10B981"/>
    <text x="325" y="31" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="end">ONLINE</text>

    <!-- Chat Messages -->
    <!-- Message 1 (User) -->
    <rect x="180" y="74" width="180" height="32" rx="12" fill="#27272A"/>
    <text x="270" y="94" fill="#F4F4F5" font-family="sans-serif" font-size="11" text-anchor="middle">Show me black jackets</text>

    <!-- Message 2 (Bot) -->
    <rect x="20" y="118" width="240" height="32" rx="12" fill="#1E1E24" stroke="#D4AF37" stroke-width="0.5"/>
    <text x="32" y="138" fill="#E4E4E7" font-family="sans-serif" font-size="11">Here are our premier black pieces:</text>

    <!-- Product Card Preview -->
    <rect x="20" y="160" width="340" height="85" rx="10" fill="#141417" stroke="#27272A" stroke-width="1"/>
    <rect x="30" y="170" width="65" height="65" rx="6" fill="#27272A"/>
    <text x="62" y="208" fill="#71717A" font-family="sans-serif" font-size="20" text-anchor="middle">🧥</text>
    <text x="108" y="188" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700">Classic Leather Moto</text>
    <text x="108" y="205" fill="#D4AF37" font-family="sans-serif" font-size="12" font-weight="800">£450.00</text>
    <rect x="108" y="214" width="90" height="18" rx="4" fill="#27272A"/>
    <text x="153" y="226" fill="#A1A1AA" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">Size S, M, L, XL</text>

    <!-- Quick Action Button -->
    <rect x="260" y="185" width="85" height="32" rx="6" fill="#D4AF37"/>
    <text x="302" y="205" fill="#000000" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">ADD TO BAG</text>

    <!-- Input Bar -->
    <rect x="20" y="262" width="340" height="38" rx="19" fill="#18181B" stroke="#27272A" stroke-width="1"/>
    <text x="40" y="285" fill="#71717A" font-family="sans-serif" font-size="11">Ask anything or upload photo...</text>
    <circle cx="310" cy="281" r="12" fill="#D4AF37"/>
    <path d="M306,281 L314,281 M310,277 L310,285" stroke="#000000" stroke-width="2"/>
    <circle cx="338" cy="281" r="12" fill="#27272A"/>
    <path d="M334,281 L341,277 L341,285 Z" fill="#A1A1AA"/>
  </g>
</svg>
