<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Web Theme Color Tokens: --bone: #EFEDE8, --ink: #101010, --mid: #8A8781, --line: rgba(16,16,16,0.14) -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Italiana&amp;family=Archivo:wght@400;600;700&amp;display=swap');
      .title-brand { font-family: 'Cinzel', 'Times New Roman', Georgia, serif; font-size: 54px; font-weight: 700; fill: #101010; letter-spacing: 6px; }
      .title-sub { font-family: 'Italiana', 'Cinzel', serif; font-size: 32px; font-weight: 400; fill: #8A8781; letter-spacing: 2px; }
      .text-body { font-family: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 400; fill: #8A8781; letter-spacing: 0.3px; }
      .card-title { font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700; fill: #8A8781; letter-spacing: 1.5px; text-transform: uppercase; }
      .card-val { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 700; fill: #EFEDE8; }
      .card-desc { font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 400; fill: #8A8781; }
      .badge-text { font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 700; fill: #EFEDE8; letter-spacing: 1.2px; }
    </style>
    <pattern id="boneGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#101010" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Canvas: Website --bone (#EFEDE8) -->
  <rect width="1200" height="420" fill="#EFEDE8" rx="16"/>
  <rect width="1200" height="420" fill="url(#boneGrid)" rx="16"/>

  <!-- Outer Border Frame: --line (rgba(16,16,16,0.14)) -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#101010" stroke-opacity="0.14" stroke-width="1.5" rx="12"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#8A8781" stroke-opacity="0.1" stroke-width="1" rx="10"/>

  <!-- Top Badge / Header Tag -->
  <g transform="translate(60, 58)">
    <rect width="210" height="28" fill="#101010" rx="14"/>
    <circle cx="16" cy="14" r="4" fill="#10B981"/>
    <text x="28" y="18" class="badge-text">ACADEMIC AI/ML SRS</text>
  </g>

  <!-- Main Hero Title in Website Brand Fonts (Cinzel & Italiana) -->
  <text x="60" y="142" class="title-brand">S A B L E</text>
  <text x="325" y="142" class="title-sub">| ApBot AI Concierge</text>

  <!-- Subtitle in Website Archivo Font & --mid (#8A8781) Color -->
  <text x="60" y="182" class="text-body">
    200-Epoch TensorFlow/Keras Neural Network &amp; Domain NLP Assistant for SABLE Haute Couture
  </text>

  <!-- Key Technical Highlight Cards: --ink (#101010) Cards with --bone (#EFEDE8) Text -->
  <g transform="translate(60, 230)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="340" height="115" fill="#101010" rx="8"/>
    <rect x="0" y="0" width="340" height="115" fill="none" stroke="#101010" stroke-opacity="0.14" stroke-width="1" rx="8"/>
    <text x="20" y="32" class="card-title">🧠 TENSORFLOW &amp; KERAS MODEL</text>
    <text x="20" y="62" class="card-val">91.58% Accuracy</text>
    <text x="20" y="88" class="card-desc">40+ Intent Tags • Bag of Words • Lemmatization</text>

    <!-- Card 2 -->
    <rect x="370" y="0" width="340" height="115" fill="#101010" rx="8"/>
    <rect x="370" y="0" width="340" height="115" fill="none" stroke="#101010" stroke-opacity="0.14" stroke-width="1" rx="8"/>
    <text x="390" y="32" class="card-title">🔤 DOMAIN SPELL CORRECTOR</text>
    <text x="390" y="62" class="card-val">16/16 Unit Tests Passed</text>
    <text x="390" y="88" class="card-desc">Normalizes typos • Preserves prices &amp; IDs</text>

    <!-- Card 3 -->
    <rect x="740" y="0" width="340" height="115" fill="#101010" rx="8"/>
    <rect x="740" y="0" width="340" height="115" fill="none" stroke="#101010" stroke-opacity="0.14" stroke-width="1" rx="8"/>
    <text x="760" y="32" class="card-title">⚡ MERN + FLASK STACK</text>
    <text x="760" y="62" class="card-val">&lt; 150ms Latency</text>
    <text x="760" y="88" class="card-desc">MongoDB • Express • React • Flask Port 5001</text>
  </g>
</svg>
